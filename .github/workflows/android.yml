name: Android-App EchoWP Trainer

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

# Minimalrechte: Bauen nur lesend, nur der Release-Job darf schreiben
permissions:
  contents: read

jobs:
  android:
    name: Android-APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Plattform-Dateien erzeugen
        run: flutter create --platforms=android --org de.echowp --project-name echowp_trainer .
      - run: flutter pub get
      - name: App-Icons erzeugen
        run: dart run flutter_launcher_icons
      - name: Signierschlüssel aus GitHub-Secrets
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD fehlen – Testversion mit Debug-Signatur"
            exit 0
          fi
          mkdir -p keystore
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > keystore/echowp-release.jks
          keytool -list -keystore keystore/echowp-release.jks -storepass "$KS_PW" > /dev/null || { echo "::error::Keystore oder Passwort ungültig"; exit 1; }
          # Schlüsselname (Alias) aus der Datei lesen, damit jede EchoWP-Schlüsseldatei passt
          ALIAS=$(keytool -list -v -keystore keystore/echowp-release.jks -storepass "$KS_PW" | sed -nE 's/^Alias name: (.*)$/\1/p; s/^Aliasname: (.*)$/\1/p' | head -1)
          [ -n "$ALIAS" ] || { echo "::error::Kein Schlüssel in der Datei gefunden"; exit 1; }
          echo "Schlüssel-Alias: $ALIAS"
          echo "$ALIAS" > keystore/alias.txt
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Plattform anpassen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: python3 tool/patch_platforms.py
      - name: Code prüfen
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test
      - name: Automatische Tests
        run: flutter test --reporter expanded
      - name: APK bauen (je Prozessortyp, verkleinert)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --build-number=${{ github.run_number }} --dart-define=ECHOWP_BUILD=${{ github.run_number }}
      - name: APKs prüfen (Größe, versionCode, Signatur)
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/EchoWP-Trainer.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/EchoWP-Trainer-alte-Geraete-32bit.apk
          AAPT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          for f in dist/*.apk; do
            echo "== $f: $(du -h "$f" | cut -f1)"
            "$AAPT/aapt2" dump badging "$f" | grep -E "^package:|native-code"
            "$AAPT/apksigner" verify --print-certs "$f" | grep -m1 "SHA-256"
          done
          if "$AAPT/aapt2" dump permissions dist/EchoWP-Trainer.apk | grep -q REQUEST_INSTALL_PACKAGES; then
            echo "::error::APK enthält REQUEST_INSTALL_PACKAGES – Play Protect stuft sie als schädlich ein"; exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EchoWP-Trainer-Android
          path: app/dist/*.apk

  release:
    name: Download-Seite (Release)
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version lesen
        id: ver
        run: |
          echo "full=$(sed -nE 's/^version: *([0-9.]+)\+.*/\1/p' app/pubspec.yaml)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Prüfsummen
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: app-v${{ steps.ver.outputs.full }}-build-${{ github.run_number }}
          name: EchoWP Trainer App v${{ steps.ver.outputs.full }} (Build ${{ github.run_number }})${{ needs.android.outputs.signed != 'true' && ' – Testversion' || '' }}
          make_latest: true
          body: |
            **Android:** `EchoWP-Trainer.apk` aufs Handy laden und installieren (alle aktuellen Handys, 64-Bit).
            Nur für sehr alte 32-Bit-Geräte: `EchoWP-Trainer-alte-Geraete-32bit.apk`.
            ${{ needs.android.outputs.signed != 'true' && 'Hinweis: Testversion mit Debug-Signatur. Für Updates ohne Neuinstallation die Secrets ANDROID_KEYSTORE_B64 und ANDROID_KEYSTORE_PASSWORD im Repo hinterlegen.' || '' }}
          files: dist/*
